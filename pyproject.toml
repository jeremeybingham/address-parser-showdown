[project]
name = "address-parser-showdown"
version = "0.0.0"
description = "A neutral, repeatable comparison of US address parsers"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "doorplate>=0.6.0",
    "usaddress>=0.5.16",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
